; ShulkerV2 Free - read the README before setting up

[checker]
; Set to 'gui' to launch with a graphical interface, 'cli' for terminal mode
; Note: auto_run mode always forces CLI regardless of this setting
mode = gui

[accuracy]
; Checker accuracy mode: fast or accurate
mode = fast
; Retry count for ambiguous results (only used in accurate mode, minimum 3)
retry_count = 5

[threads]
mode = auto
count = 40

[proxy]
mode = sticky
protocol = http
file = proxies.txt
api_url = 
validate = true

[features]
hypixel_check = true
ban_check = true
xbox_perks = true
ms_rewards = true
set_name = false
set_skin = false
skin_url = https://s.namemc.com/i/61025d58f5bd6241.png
inbox_checker = true
inbox_keywords = Steam, Netflix, PayPal, Roblox, Riot

[naming]
prefix = Sv2
suffix = 
separator = _
use_words = true
words = 1
random_length = 3

[input]
combos = combos.txt

[display]
show_invalid = true
show_valid = true
show_hits = true
show_locked = true

[output]
create_results_folder = true
save_by_category = true

[auto_run]
enabled = false
proxy_protocol = http
proxy_mode = sticky
display_mode = logs
threads = 0

[gui_settings]
; Tab layout style: sidebar, topbar, iconrail, folder
tab_style = sidebar
; UI theme: dark, light
theme = dark
